name: Nelo
description: 'Nelo is a Mexican fintech offering consumer credit that lets shoppers buy now and
  pay later in bi-weekly installments (quincenas). Its mobile app (iOS and Android) provides instant
  credit approval, an in-app marketplace (Tienda Nelo), bill payment for utilities such as CFE, water,
  gas and internet, phone recharges, cash withdrawals, and a premium Nelo VIP tier with a physical
  credit card. Backed by Homebrew, Nelo operates primarily as a consumer mobile product and, as of this
  enrichment pass, publishes no public developer API, developer portal, or API documentation. Sector:
  fintech / buy-now-pay-later (BNPL).'
